<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>环境理解测评 | 五榜</title>
    <meta name="description" content="第五人格当前排位环境理解测评与个性化上分建议。" />
    <link rel="icon" href="assets/wubang-icon.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="assessment-page-body">
    <header class="site-header">
      <nav class="nav-shell" aria-label="测评页导航">
        <a class="brand" href="updates.html"><span class="brand-mark"><img src="assets/wubang-icon.jpg" alt="" /></span><span><strong>五榜</strong><small>环境理解测评</small></span></a>
        <div class="nav-links"><a href="index.html#rankings">八段榜单</a><a href="guide.html">版本指南</a></div>
      </nav>
    </header>
    <main>
      <section class="section character-page assessment-page">
        <div class="section-heading">
          <p class="eyebrow">Rank awareness test</p>
          <h1>你的环境理解到哪一层？</h1>
          <p>十道题覆盖选角、BP、地图、救援、样本量和连败复盘。完成后给出对应的角色池建议。</p>
        </div>
        <form id="fullAssessment" class="assessment-form assessment-form-full">
          <fieldset><legend>1. 你会如何使用榜单？</legend><label><input required type="radio" name="q1" value="3" />先按自己的段位筛选，再对照角色详情</label><label><input type="radio" name="q1" value="2" />主要看巅七排行</label><label><input type="radio" name="q1" value="1" />直接练综合第一名</label></fieldset>
          <fieldset><legend>2. 高胜率低出场意味着：</legend><label><input required type="radio" name="q2" value="3" />可能是绝活样本，需要降低信度</label><label><input type="radio" name="q2" value="2" />角色一定很强</label><label><input type="radio" name="q2" value="1" />角色一定冷门且弱</label></fieldset>
          <fieldset><legend>3. 高段位 BP 更应关注：</legend><label><input required type="radio" name="q3" value="3" />禁用压力、地图与替代池</label><label><input type="radio" name="q3" value="2" />单项胜率</label><label><input type="radio" name="q3" value="1" />角色外观</label></fieldset>
          <fieldset><legend>4. 求生阵容缺救援位时：</legend><label><input required type="radio" name="q4" value="3" />补稳定救援或让队友明确分工</label><label><input type="radio" name="q4" value="2" />仍然选择自己最想玩的角色</label><label><input type="radio" name="q4" value="1" />全员带化险即可</label></fieldset>
          <fieldset><legend>5. 新角色样本较少时：</legend><label><input required type="radio" name="q5" value="3" />先看机制与相对数据，保留修正空间</label><label><input type="radio" name="q5" value="2" />首周胜率就是最终强度</label><label><input type="radio" name="q5" value="1" />完全不参考数据</label></fieldset>
          <fieldset><legend>6. 地图明显不利于主练角色时：</legend><label><input required type="radio" name="q6" value="3" />切同定位替代角色，维持阵容功能</label><label><input type="radio" name="q6" value="2" />继续使用，但更保守处理资源</label><label><input type="radio" name="q6" value="1" />地图不影响选角</label></fieldset>
          <fieldset><legend>7. 监管者选择要同时看：</legend><label><input required type="radio" name="q7" value="3" />追击、守椅、控场和被克制关系</label><label><input type="radio" name="q7" value="2" />追击速度</label><label><input type="radio" name="q7" value="1" />自己喜欢的皮肤</label></fieldset>
          <fieldset><legend>8. 连续平局时最该检查：</legend><label><input required type="radio" name="q8" value="3" />中后期运营、救援交换和开门战资源</label><label><input type="radio" name="q8" value="2" />只看第一波牵制时间</label><label><input type="radio" name="q8" value="1" />怪队友或匹配</label></fieldset>
          <fieldset><legend>9. 出场率高但胜率一般时：</legend><label><input required type="radio" name="q9" value="3" />说明角色普适，但需要看段位和队伍收益</label><label><input type="radio" name="q9" value="2" />说明角色很弱</label><label><input type="radio" name="q9" value="1" />说明大家都跟风</label></fieldset>
          <fieldset><legend>10. 想稳定上分，角色池最好：</legend><label><input required type="radio" name="q10" value="3" />主练 2 个定位，再准备 1 个补位</label><label><input type="radio" name="q10" value="2" />只练一个绝活</label><label><input type="radio" name="q10" value="1" />每天换版本热门</label></fieldset>
          <button class="primary-action" type="submit">查看完整结果</button>
        </form>
        <div id="fullAssessmentResult" class="assessment-result" aria-live="polite"></div>
      </section>
    </main>
    <footer class="footer"><p>测评结果用于组织排位思路，不替代个人熟练度。</p></footer>
    <script src="assessment.js"></script>
  </body>
</html>
